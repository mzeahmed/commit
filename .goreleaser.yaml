# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

# Toujours nommé "commit", quel que soit le nom du dépôt GitHub.
project_name: commit

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: commit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    # Nomme les archives comme le ferait `uname` (commit_Linux_x86_64).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Version utilisée pour les builds locaux (--snapshot), sans tag git.
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
