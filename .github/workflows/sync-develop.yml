# Après chaque pull request fusionnée dans main, reporte main dans develop
# pour que develop ne prenne jamais de retard (ex. correctif fusionné
# directement dans main). Échoue en cas de conflit : la fusion se fait
# alors à la main, rien n'est poussé.
name: Sync develop

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# contents: write permet de pousser le commit de fusion sur develop.
permissions:
  contents: write

# Une seule synchronisation à la fois : deux PR fusionnées coup sur coup
# ne poussent pas en parallèle sur develop.
concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into develop
    # Seulement pour une PR réellement fusionnée (pas une PR fermée sans
    # fusion). Après une PR develop → main, seul le commit de fusion (ou de
    # squash) de main est reporté : rien à faire si develop le contient déjà.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          # Historique complet : nécessaire pour fusionner main.
          fetch-depth: 0

      - name: Merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop contient déjà main : rien à faire."
            exit 0
          fi

          if ! git merge --no-ff origin/main -m "chore: report de main dans develop (PR #${{ github.event.pull_request.number }})"; then
            echo "::error::Conflit en fusionnant main dans develop : à résoudre à la main."
            git merge --abort
            exit 1
          fi

          git push origin develop
